[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqtuator-identification"
version = "0.1.0"
description = "Host-side torque excitation, acquisition and servo identification for the AQTUATOR test rig"
requires-python = ">=3.10"
dependencies = [
    "pyserial",
    "odrive>=0.6.11.post0",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "PyQt5",
]

[project.scripts]
aqtuator-sequential = "aqtuator_id.sequential_run:main"
aqtuator-servo-id = "aqtuator_id.servo_identification:main"
aqtuator-multisine = "aqtuator_id.multisine:main"

[tool.setuptools.packages.find]
where = ["src"]
