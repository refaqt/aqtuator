name: Pages

# Publishes the web pages in simulation/cases/ as static pages on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# The pages are then at
#   https://refaqt.github.io/aqtuator/strip-seal/
#   https://refaqt.github.io/aqtuator/cutting-force/
#   https://refaqt.github.io/aqtuator/damper/
#   https://refaqt.github.io/aqtuator/crash/

on:
  push:
    branches: [main]
    paths:
      - "simulation/cases/strip-seal-designer/**"
      - "simulation/cases/cutting-force-rejection/**"
      - "simulation/cases/damper-sizing/**"
      - "simulation/cases/end-stop-crash-results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No submodules: only the page folders are published.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No package.json and nothing to cache. This job can deploy, so no cache.
          package-manager-cache: false

      - name: Check the models before publishing
        run: |
          node simulation/cases/strip-seal-designer/check_model.mjs
          node simulation/cases/cutting-force-rejection/check_model.mjs
          node simulation/cases/damper-sizing/check_model.mjs
          node simulation/cases/end-stop-crash-results/check_data.mjs

      - name: Collect the site
        run: |
          mkdir -p _site/strip-seal _site/cutting-force _site/damper _site/crash
          cp simulation/cases/strip-seal-designer/index.html \
             simulation/cases/strip-seal-designer/strip_model.js _site/strip-seal/
          cp simulation/cases/cutting-force-rejection/index.html \
             simulation/cases/cutting-force-rejection/control_model.js _site/cutting-force/
          cp simulation/cases/damper-sizing/index.html \
             simulation/cases/damper-sizing/damper_model.js _site/damper/
          cp simulation/cases/end-stop-crash-results/index.html \
             simulation/cases/end-stop-crash-results/page.js \
             simulation/cases/end-stop-crash-results/crash_data.js \
             simulation/cases/end-stop-crash-results/fem_fields.js _site/crash/
          # Add the commit to the model address. A browser that still holds the
          # old model file in its cache then fetches the new one, instead of
          # running the new page against the old model.
          v="${GITHUB_SHA:0:12}"
          sed -i "s#from \"./strip_model.js\"#from \"./strip_model.js?v=$v\"#" _site/strip-seal/index.html
          sed -i "s#src=\"./control_model.js\"#src=\"./control_model.js?v=$v\"#" _site/cutting-force/index.html
          sed -i "s#src=\"./damper_model.js\"#src=\"./damper_model.js?v=$v\"#" _site/damper/index.html
          grep -q "strip_model.js?v=$v" _site/strip-seal/index.html
          grep -q "control_model.js?v=$v" _site/cutting-force/index.html
          for f in crash_data.js fem_fields.js page.js; do
            sed -i "s#src=\"./$f\"#src=\"./$f?v=$v\"#" _site/crash/index.html
            grep -q "$f?v=$v" _site/crash/index.html
          done
          grep -q "damper_model.js?v=$v" _site/damper/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AQTUATOR pages</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px 16px;background:#f2f4f4;color:#1a2227}
          @media (prefers-color-scheme:dark){body{background:#12181b;color:#e3e9ec}a{color:#5cb8c2}}</style>
          <h1>AQTUATOR pages</h1>
          <ul>
          <li><a href="strip-seal/">Strip Seal Designer</a></li>
          <li><a href="cutting-force/">Cutting Force Rejection</a></li>
          <li><a href="damper/">Damper Sizing</a></li>
          <li><a href="crash/">End-Stop Crash Results</a></li>
          </ul>
          HTML

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
