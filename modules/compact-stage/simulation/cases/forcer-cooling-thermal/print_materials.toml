# Heat limits of 3D printing materials for the cooling block.
# Every number is from the maker's technical data sheet (link in "source").
# HDT = heat deflection temperature (ISO 75 or ASTM D648): the temperature at
# which a test bar bends a set amount under 0.45 MPa or 1.8 MPa.
# Tg = glass transition temperature: above it the material gets soft.
# A value of -1 means: not given in the data sheet.
# Read on 2026-11-25.

[[material]]
name = "Formlabs Grey V5 (standard resin)"
process = "SLA"
condition = "post-cured 15 min at 60 C (Form Cure)"
hdt_045 = 71.0
hdt_18 = 59.0
tg = -1
modulus_mpa = 2675
cte = -1
source = "https://media.formlabs.com/m/2b42aa20e7da7db7/original/-ENUS-Grey-Resin-V5-TDS.pdf"

