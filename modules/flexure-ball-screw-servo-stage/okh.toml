function = "Linear stage that suppresses chatter actively: it measures the vibration between tool and workpiece and drives a short-stroke actuator against it, so the machine can take a deeper cut. The stage is guided by flexures, driven by a ball screw and a servo motor. This module holds the measurement campaigns on the test machine, the excitation firmware, and the host software that identifies the machine response."
